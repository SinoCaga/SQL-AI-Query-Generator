<!DOCTYPE html>
<html>
<head>
  <title>AI SQL Generator</title>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="styles.css?v=2">
</head>

<body>
  <div class="container">

    <h1>🧠 AI SQL Generator</h1>

    <input id="input" placeholder="Ask something like: show users from 2023">

    <div id="sqlBox" class="box"></div>

    <button id="copyBtn" onclick="copySQL()">Copy SQL</button>

    <h3>Results</h3>
    <div id="results"></div>

  </div>

  <script src="app.js"></script>
</body>
</html>
